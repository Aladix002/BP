# Parametre pre slam_toolbox v simulacii.
# Tento profil je nastaveny na:
# - indoor mapovanie,
# - lidar s rozsahom cca do 12 m,
# - rozumny kompromis medzi presnostou a vykonom.
#
# Najdolezitejsie sekcie:
# 1) Frames:
#    odom_frame/map_frame/base_frame musia sediet s TF stromom robota.
# 2) Vykon:
#    map_update_interval, scan_queue_size, throttle_scans ovplyvnuju CPU.
# 3) Scan matching:
#    agresivita lokalneho porovnavania skenov.
# 4) Loop closing:
#    schopnost opravovat drift po navrate na uz navstivene miesto.
# 5) Correlation search:
#    rozmery a rozlisenie priestoru, kde sa hlada najlepsie zarovnanie.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss

    mode: mapping

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    scan_queue_size: 1
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    min_laser_range: 0.03
    max_laser_range: 12.0
    minimum_time_interval: 0.1
    transform_timeout: 0.25
    tf_buffer_duration: 30.0
    stack_size_to_use: 80000000

    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10

    use_scan_matching: true
    use_scan_barycenter: false
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.40
    link_scan_maximum_distance: 2.0

    do_loop_closing: true
    loop_search_maximum_distance: 5.0
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.50
    loop_match_minimum_response_fine: 0.75

    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.005
    correlation_search_space_smear_deviation: 0.05

    loop_search_space_dimension: 10.0
    loop_search_space_resolution: 0.025
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.3
    fine_search_angle_offset: 0.00175
    coarse_search_angle_offset: 0.523
    coarse_angle_resolution: 0.0174
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 3
    occupancy_threshold: 0.1

    debug_logging: false
    enable_interactive_mode: true
    position_covariance_scale: 1.0
    yaw_covariance_scale: 1.0
    use_map_saver: true
    restamp_tf: false
    check_min_dist_and_heading_precisely: true

    use_pose_extrapolator: false
