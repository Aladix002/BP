# Tento subor urcuje prioritu viacerych cmd_vel vstupov.
# Ciel:
# - manualne riadenie z klavesnice ma mat prednost,
# - nav2 ma riadit len ked manualny vstup mlci.
#
# topic /cmd_vel_key:
#   publikuje teleop_twist_keyboard.
#   timeout 0.5 znamena, ze po 0.5s bez spravy sa manualny zdroj povazuje za neaktivny.
#
# topic /cmd_vel_nav:
#   publikuje nav2/controller.
#   timeout 2.0 je dlhsie okno, aby nav2 neodpadaval pri kratkom jitteri.

twist_mux:
  ros__parameters:
    use_stamped: false
    topics:
      teleop:
        topic   : /cmd_vel_key
        timeout : 0.5
        priority: 100
      navigation:
        topic   : /cmd_vel_nav
        timeout : 2.0
        priority: 10
