# EKF: len IMU; yaw z gyro; SLAM drzi map->odom.
ekf_filter_node:
    ros__parameters:
        frequency: 25.0
        sensor_timeout: 0.1
        two_d_mode: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        publish_tf: true
        publish_acceleration: false
        print_diagnostics: false
        debug: false

        imu0: /imu
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: false
        imu0_queue_size: 10
        imu0_nodelay: true
