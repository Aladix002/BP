# EKF (robot_localization): len IMU, bez enkoderov. Yaw z gyro; poloha driftuje, SLAM tahne map->odom.
ekf_filter_node:
    ros__parameters:
        frequency: 25.0
        sensor_timeout: 0.1
        two_d_mode: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        # Filtrovany stav sa publikuje do odom frame (spolu s TF odom->base_link)
        world_frame: odom

        publish_tf: true
        publish_acceleration: false
        print_diagnostics: false
        debug: false

        # IMU z Arduina (imu_serial_fusion_bridge) -> /imu
        imu0: /imu
        # Ktore polozky z Imu pouzit: true = pouzit vo fuzi (13 bool podla dokumentacie ekf)
        imu0_config: [false, false, false,
                      false, false, false,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: false
        imu0_queue_size: 10
        imu0_nodelay: true
