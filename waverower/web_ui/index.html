<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Wave Rover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['"Source Sans 3"', 'system-ui', 'sans-serif'],
            display: ['Outfit', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    /* range thumb accent not supported via Tailwind CDN on all browsers */
    input[type="range"] { accent-color: #60a5fa; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen
             [background-image:radial-gradient(ellipse_100%_80%_at_50%_-30%,#1c2838_0%,transparent_55%)]">
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="app.js?v=50" data-presets="react"></script>
</body>
</html>
