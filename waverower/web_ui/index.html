<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Wave Rover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>
  <header class="topbar">
    <h1>Wave Rover</h1>
    <span id="status" class="status-pill off" role="status">Disconnected</span>
  </header>

  <section class="strip strip-connect" aria-label="Connection">
    <label class="strip-label" for="wsUrl">WebSocket</label>
    <div class="strip-row">
      <input type="text" id="wsUrl" class="ws-input" placeholder="ws://192.168.1.x:9090" autocomplete="off" />
      <div class="btn-pair">
        <button type="button" id="btnConnect" class="btn-compact btn-primary">Connect</button>
        <button type="button" id="btnDisconnect" class="btn-compact btn-ghost">Disconnect</button>
      </div>
    </div>
  </section>

  <section class="strip strip-mode" aria-label="Mode">
    <span class="strip-label">Mode</span>
    <div class="segmented" role="group" aria-label="Manual or Wander">
      <button type="button" id="btnManual" class="seg mode-btn active">Manual</button>
      <button type="button" id="btnWander" class="seg mode-btn">Wander</button>
    </div>
    <p id="modeStatus" class="mode-line">—</p>
  </section>

  <section class="cam-drive" aria-label="Camera and drive">
    <div class="cam-col">
      <span class="cam-label">Camera</span>
      <div class="cam-frame">
        <div id="camPlaceholder" class="cam-placeholder">No feed</div>
        <img id="cam" alt="Camera" class="cam hidden" />
      </div>
    </div>
    <div class="drive-col">
      <span class="cam-label">Drive <span class="hint-inline">hold</span></span>
      <div class="dpad dpad-compact">
        <div></div>
        <button type="button" class="drive" data-lx="0.5" data-az="0" aria-label="Forward">▲</button>
        <div></div>
        <button type="button" class="drive" data-lx="0" data-az="0.9" aria-label="Left">◀</button>
        <button type="button" class="stop" id="btnStop" aria-label="Stop">■</button>
        <button type="button" class="drive" data-lx="0" data-az="-0.9" aria-label="Right">▶</button>
        <div></div>
        <button type="button" class="drive" data-lx="-0.5" data-az="0" aria-label="Back">▼</button>
        <div></div>
      </div>
      <div class="speed-block">
        <div class="speed-row">
          <label for="maxLin">Linear max [m/s]</label>
          <div class="speed-row-inner">
            <input type="range" id="maxLin" min="0.05" max="0.9" step="0.01" value="0.5" />
            <span id="maxLinVal" class="speed-val">0.50</span>
          </div>
        </div>
        <div class="speed-row">
          <label for="maxAng">Angular max [rad/s]</label>
          <div class="speed-row-inner">
            <input type="range" id="maxAng" min="0.2" max="3.0" step="0.05" value="1.8" />
            <span id="maxAngVal" class="speed-val">1.80</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
