# robot_localization EKF – IMU-only odom (bez enkodérov)
# Fúzia: len yaw rate z gyra → odom→base_link obsahuje rotáciu, pozícia zostáva na 0.
# SLAM (scan matching) koriguje polohu cez map→odom transform.
ekf_filter_node:
    ros__parameters:
        # 50 Hz na slabšom HW často nevyjde; znižuje „Failed to meet update rate!“
        frequency: 25.0
        sensor_timeout: 0.1
        two_d_mode: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        publish_tf: true
        publish_acceleration: false
        print_diagnostics: false
        debug: false

        # IMU z Arduina (cez imu_serial_fusion_bridge) → /imu
        imu0: /imu
        # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
        imu0_config: [false, false, false,
                      false, false, false,   # orientáciu ignorujeme – yaw_gyro driftuje bez magnetu
                      false, false, false,
                      false, false, true,    # yaw rate (gyro Z) – čistý merateľný signál
                      false, false, false]
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: false
        imu0_queue_size: 10
        imu0_nodelay: true
