# robot_localization EKF, IMU-only odom (bez enkoderov)
# yaw rate z gyra -> odom->base_link rotacia; poloha 0
# SLAM koriguje cez map->odom
ekf_filter_node:
    ros__parameters:
        # 25 Hz - slabsi HW nestiha 50 Hz
        frequency: 25.0
        sensor_timeout: 0.1
        two_d_mode: true

        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        publish_tf: true
        publish_acceleration: false
        print_diagnostics: false
        debug: false

        # IMU z Arduina (imu_serial_fusion_bridge) -> /imu
        imu0: /imu
        # [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
        imu0_config: [false, false, false,
                      false, false, false,   # orientacia off (yaw drift bez magnetu)
                      false, false, false,
                      false, false, true,    # yaw rate gyro Z
                      false, false, false]
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: false
        imu0_queue_size: 10
        imu0_nodelay: true
