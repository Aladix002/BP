<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wave Rover Control</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d1117;
    --card:     #161b22;
    --border:   #30363d;
    --accent:   #238636;
    --danger:   #da3633;
    --warn:     #d29922;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --blue:     #1f6feb;
    --radius:   10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px;
    overflow-x: hidden;
  }

  /* ── header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .header h1 { font-size: 1.1rem; font-weight: 600; }
  .conn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--danger);
    display: inline-block;
    margin-right: 6px;
    transition: background .3s;
  }
  .conn-dot.ok { background: var(--accent); }
  .conn-label  { font-size: .8rem; color: var(--muted); }

  /* ── cards ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }
  .card-title { font-size: .75rem; color: var(--muted); text-transform: uppercase;
                letter-spacing: .05em; margin-bottom: 8px; }

  /* ── camera ── */
  #cam-wrap { position: relative; border-radius: var(--radius); overflow: hidden;
              background: #000; min-height: 140px; text-align: center; }
  #cam-img  { width: 100%; max-height: 260px; object-fit: contain; display: block; }
  #cam-err  { position: absolute; inset: 0; display: flex; align-items: center;
              justify-content: center; color: var(--muted); font-size: .85rem; }

  /* ── status grid ── */
  .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 6px; padding: 8px;
          text-align: center; border: 1px solid var(--border); }
  .stat .val { font-size: 1.2rem; font-weight: 700; }
  .stat .lbl { font-size: .65rem; color: var(--muted); margin-top: 2px; }

  /* ── mode buttons ── */
  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 12px 8px; border: none; border-radius: var(--radius);
    font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
    color: #fff;
  }
  .btn:active { opacity: .7; }
  .btn.manual { background: var(--blue); }
  .btn.auto   { background: var(--accent); }
  .btn.slam   { background: var(--warn); color: #000; }
  .btn.nav    { background: #6e40c9; }
  .btn.estop  { background: var(--danger); font-size: 1rem; }
  .btn.active { outline: 2px solid #fff; }

  /* ── goal input ── */
  .goal-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .goal-row input {
    flex: 1; min-width: 60px; padding: 9px 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: .9rem;
  }
  .goal-row input::placeholder { color: var(--muted); }
  .btn-send { flex: 0 0 auto; padding: 9px 16px; background: var(--accent);
              border: none; border-radius: 6px; color: #fff; font-weight: 600;
              cursor: pointer; font-size: .9rem; }

  /* ── joystick zone ── */
  #joystick-zone {
    position: relative;
    width: min(240px, 80vw);
    height: min(240px, 80vw);
    margin: 0 auto;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    touch-action: none;
  }

  /* ── connection settings ── */
  .conn-row { display: flex; gap: 6px; }
  .conn-row input {
    flex: 1; padding: 8px 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: .85rem;
  }
  .btn-connect { padding: 8px 14px; background: var(--blue);
                 border: none; border-radius: 6px; color: #fff;
                 font-weight: 600; cursor: pointer; font-size: .85rem; }

  /* ── lidar canvas ── */
  #lidar-canvas {
    display: block; margin: 0 auto;
    border-radius: var(--radius);
    background: #000;
  }

  /* ── log ── */
  #log { font-size: .72rem; color: var(--muted); max-height: 80px;
         overflow-y: auto; font-family: monospace; }
</style>
</head>
<body>

<!-- ═══ HEADER ═══════════════════════════════════════════════════════════ -->
<div class="header">
  <h1>&#x1F916; Wave Rover</h1>
  <div>
    <span class="conn-dot" id="dot"></span>
    <span class="conn-label" id="conn-lbl">Disconnected</span>
  </div>
</div>

<!-- ═══ CONNECTION SETTINGS ══════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Connection</div>
  <div class="conn-row">
    <input type="text" id="robot-ip" placeholder="192.168.0.x" value="">
    <button class="btn-connect" onclick="connect()">Connect</button>
  </div>
</div>

<!-- ═══ CAMERA ════════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Camera</div>
  <div id="cam-wrap">
    <img id="cam-img" src="" alt="" style="display:none" onerror="camErr()"
         onload="camOk()">
    <div id="cam-err">No camera stream</div>
  </div>
</div>

<!-- ═══ STATUS ════════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Status</div>
  <div class="status-grid">
    <div class="stat"><div class="val" id="s-mode">—</div><div class="lbl">Mode</div></div>
    <div class="stat"><div class="val" id="s-nav">—</div><div class="lbl">Nav task</div></div>
    <div class="stat"><div class="val" id="s-dist">—</div><div class="lbl">Front dist</div></div>
    <div class="stat"><div class="val" id="s-lin">0.00</div><div class="lbl">Lin m/s</div></div>
    <div class="stat"><div class="val" id="s-ang">0.00</div><div class="lbl">Ang r/s</div></div>
    <div class="stat"><div class="val" id="s-ping">—</div><div class="lbl">Latency</div></div>
  </div>
</div>

<!-- ═══ DRIVE MODE ════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Drive mode</div>
  <div class="btn-row" style="margin-bottom:8px">
    <button class="btn manual" id="btn-manual" onclick="setMode('manual')">MANUAL</button>
    <button class="btn auto"   id="btn-auto"   onclick="setMode('auto')">AUTONOMOUS</button>
  </div>
  <div class="btn-row">
    <button class="btn slam" id="btn-slam" onclick="setNavTask('slam')">SLAM (map)</button>
    <button class="btn nav"  id="btn-nav"  onclick="setNavTask('nav')">NAV2 (goto)</button>
    <button class="btn"      id="btn-off"  onclick="setNavTask('off')"
            style="background:var(--muted)">OFF</button>
  </div>
</div>

<!-- ═══ NAV GOAL ══════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Navigation goal (map frame)</div>
  <div class="goal-row">
    <input type="number" id="gx" placeholder="X m" step="0.1">
    <input type="number" id="gy" placeholder="Y m" step="0.1">
    <input type="number" id="gyaw" placeholder="Yaw °" step="5" value="0">
    <button class="btn-send" onclick="sendGoal()">GO</button>
    <button class="btn-send" style="background:var(--warn);color:#000"
            onclick="cancelGoal()">STOP</button>
  </div>
</div>

<!-- ═══ JOYSTICK ══════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Manual joystick</div>
  <div id="joystick-zone"></div>
</div>

<!-- ═══ LIDAR ═════════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">LiDAR scan (top view)</div>
  <canvas id="lidar-canvas" width="260" height="260"></canvas>
</div>

<!-- ═══ E-STOP ════════════════════════════════════════════════════════════ -->
<button class="btn estop" onclick="eStop()">&#9940; EMERGENCY STOP</button>

<!-- ═══ LOG ═══════════════════════════════════════════════════════════════ -->
<div class="card">
  <div class="card-title">Log</div>
  <div id="log"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════════════
     SCRIPTS  (roslib + nippleJS from CDN, no build step needed)
════════════════════════════════════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>

<script>
// ── constants ────────────────────────────────────────────────────────────
const MAX_LIN = 0.35;   // m/s
const MAX_ANG = 1.5;    // rad/s
const JOYSTICK_HZ = 10; // publishes per second while joystick active

// ── state ────────────────────────────────────────────────────────────────
let ros = null;
let publishers = {};
let subscribers = {};
let actionClient = null;
let goalHandle   = null;
let joystickInterval = null;
let cmdLinear = 0, cmdAngular = 0;
let connected = false;

// ── log helper ───────────────────────────────────────────────────────────
function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML = `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>` + el.innerHTML;
}

// ── connection ────────────────────────────────────────────────────────────
function connect() {
  const ip = document.getElementById('robot-ip').value.trim() ||
             window.location.hostname;
  localStorage.setItem('rover_ip', ip);

  if (ros) { try { ros.close(); } catch(e){} }

  log(`Connecting to ws://${ip}:9090 …`);
  ros = new ROSLIB.Ros({ url: `ws://${ip}:9090` });

  ros.on('connection', () => {
    connected = true;
    document.getElementById('dot').classList.add('ok');
    document.getElementById('conn-lbl').textContent = 'Connected';
    log('Connected to rosbridge');
    // Update camera src
    document.getElementById('cam-img').src =
      `http://${ip}:8080/stream?topic=/camera/compressed`;
    document.getElementById('cam-err').style.display = 'none';
    setupPubs();
    setupSubs();
    setupActionClient();
    startLatencyPing();
  });

  ros.on('error', (e) => {
    connected = false;
    document.getElementById('dot').classList.remove('ok');
    document.getElementById('conn-lbl').textContent = 'Error';
    log('ROS error: ' + e);
  });

  ros.on('close', () => {
    connected = false;
    document.getElementById('dot').classList.remove('ok');
    document.getElementById('conn-lbl').textContent = 'Disconnected';
    log('Disconnected');
  });
}

// ── publishers ────────────────────────────────────────────────────────────
function setupPubs() {
  publishers.cmdVel = new ROSLIB.Topic({
    ros, name: '/cmd_vel_teleop',
    messageType: 'geometry_msgs/Twist'
  });
  publishers.mode = new ROSLIB.Topic({
    ros, name: '/mode',
    messageType: 'std_msgs/String'
  });
  publishers.navMode = new ROSLIB.Topic({
    ros, name: '/nav_mode',
    messageType: 'std_msgs/String'
  });
  publishers.shutdown = new ROSLIB.Topic({
    ros, name: '/shutdown',
    messageType: 'std_msgs/String'
  });
}

// ── subscribers ───────────────────────────────────────────────────────────
function setupSubs() {
  // Current drive mode
  subscribers.mode = new ROSLIB.Topic({
    ros, name: '/current_mode', messageType: 'std_msgs/String'
  });
  subscribers.mode.subscribe(msg => {
    document.getElementById('s-mode').textContent = msg.data.toUpperCase();
    ['btn-manual','btn-auto'].forEach(id =>
      document.getElementById(id).classList.remove('active'));
    document.getElementById(msg.data === 'auto' ? 'btn-auto' : 'btn-manual')
            .classList.add('active');
  });

  // Nav task status
  subscribers.navStatus = new ROSLIB.Topic({
    ros, name: '/nav_mode_status', messageType: 'std_msgs/String'
  });
  subscribers.navStatus.subscribe(msg => {
    document.getElementById('s-nav').textContent = msg.data.toUpperCase();
    ['btn-slam','btn-nav','btn-off'].forEach(id =>
      document.getElementById(id).classList.remove('active'));
    const map = { slam:'btn-slam', nav:'btn-nav', off:'btn-off' };
    if (map[msg.data]) document.getElementById(map[msg.data]).classList.add('active');
  });

  // LiDAR front sector
  subscribers.lidar = new ROSLIB.Topic({
    ros, name: '/lidar_sectors', messageType: 'std_msgs/Float64MultiArray'
  });
  subscribers.lidar.subscribe(msg => {
    const d = msg.data[0];
    document.getElementById('s-dist').textContent =
      isFinite(d) ? d.toFixed(2) + ' m' : '∞';
  });

  // Full LaserScan for mini visualisation
  subscribers.scan = new ROSLIB.Topic({
    ros, name: '/scan', messageType: 'sensor_msgs/LaserScan',
    throttle_rate: 200
  });
  subscribers.scan.subscribe(drawLidar);

  // cmd_vel echo (to show actual commanded velocity)
  subscribers.cmdVelOut = new ROSLIB.Topic({
    ros, name: '/cmd_vel', messageType: 'geometry_msgs/Twist',
    throttle_rate: 200
  });
  subscribers.cmdVelOut.subscribe(msg => {
    document.getElementById('s-lin').textContent = msg.linear.x.toFixed(2);
    document.getElementById('s-ang').textContent = msg.angular.z.toFixed(2);
  });
}

// ── Nav2 action client ────────────────────────────────────────────────────
function setupActionClient() {
  actionClient = new ROSLIB.ActionClient({
    ros,
    serverName: '/navigate_to_pose',
    actionName:  'nav2_msgs/action/NavigateToPose'
  });
}

function sendGoal() {
  const x   = parseFloat(document.getElementById('gx').value);
  const y   = parseFloat(document.getElementById('gy').value);
  const yaw = (parseFloat(document.getElementById('gyaw').value) || 0) * Math.PI / 180;

  if (isNaN(x) || isNaN(y)) { log('Enter valid X and Y'); return; }
  if (!actionClient)         { log('Not connected'); return; }

  setMode('auto');

  const sinH = Math.sin(yaw / 2), cosH = Math.cos(yaw / 2);

  const goal = new ROSLIB.Goal({
    actionClient,
    goalMessage: {
      pose: {
        header: { frame_id: 'map' },
        pose: {
          position:    { x, y, z: 0 },
          orientation: { x: 0, y: 0, z: sinH, w: cosH }
        }
      }
    }
  });

  goal.on('result',   r => { log('Goal result: ' + JSON.stringify(r)); goalHandle = null; });
  goal.on('feedback', f => {
    const d = f.feedback?.distance_remaining;
    if (d !== undefined)
      document.getElementById('s-dist').textContent = d.toFixed(2) + ' m*';
  });

  goal.send();
  goalHandle = goal;
  log(`Goal sent: x=${x.toFixed(2)} y=${y.toFixed(2)} yaw=${(yaw*180/Math.PI).toFixed(0)}°`);
}

function cancelGoal() {
  if (goalHandle) { goalHandle.cancel(); goalHandle = null; log('Goal cancelled'); }
  publishCmdVel(0, 0);
}

// ── mode control ──────────────────────────────────────────────────────────
function setMode(mode) {
  if (!connected) return;
  publishers.mode.publish(new ROSLIB.Message({ data: mode }));
  log('Mode → ' + mode);
}

function setNavTask(task) {
  if (!connected) return;
  publishers.navMode.publish(new ROSLIB.Message({ data: task }));
  log('Nav task → ' + task);
}

function eStop() {
  publishCmdVel(0, 0);
  setMode('manual');
  cancelGoal();
  log('E-STOP');
}

// ── cmd_vel publisher ─────────────────────────────────────────────────────
function publishCmdVel(lin, ang) {
  if (!connected || !publishers.cmdVel) return;
  publishers.cmdVel.publish(new ROSLIB.Message({
    linear:  { x: lin, y: 0, z: 0 },
    angular: { x: 0,   y: 0, z: ang }
  }));
}

// ── joystick ──────────────────────────────────────────────────────────────
const joystick = nipplejs.create({
  zone:       document.getElementById('joystick-zone'),
  mode:       'static',
  position:   { left: '50%', top: '50%' },
  color:      '#238636',
  size:       120,
});

joystick.on('move', (evt, data) => {
  const angle  = data.angle.radian;      // 0=right, π/2=up
  const force  = Math.min(data.force, 1);
  cmdLinear  =  Math.sin(angle) * force * MAX_LIN;
  cmdAngular = -Math.cos(angle) * force * MAX_ANG;

  if (!joystickInterval) {
    joystickInterval = setInterval(() => publishCmdVel(cmdLinear, cmdAngular),
                                   1000 / JOYSTICK_HZ);
  }
});

joystick.on('end', () => {
  clearInterval(joystickInterval);
  joystickInterval = null;
  cmdLinear = cmdAngular = 0;
  publishCmdVel(0, 0);
});

// ── LiDAR visualisation ───────────────────────────────────────────────────
function drawLidar(scan) {
  const canvas = document.getElementById('lidar-canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W / 2, cy = H / 2;
  const scale = (W / 2 - 10) / 4.0;   // 4m max visible radius

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Grid rings
  ctx.strokeStyle = '#1a2030';
  ctx.lineWidth = 1;
  for (let r = 1; r <= 4; r++) {
    ctx.beginPath();
    ctx.arc(cx, cy, r * scale, 0, 2 * Math.PI);
    ctx.stroke();
  }

  // Robot
  ctx.fillStyle = '#1f6feb';
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, 2 * Math.PI);
  ctx.fill();

  // Scan points
  ctx.fillStyle = '#39d353';
  const { ranges, angle_min, angle_increment, range_min, range_max } = scan;
  for (let i = 0; i < ranges.length; i++) {
    const r = ranges[i];
    if (!isFinite(r) || r < range_min || r > Math.min(range_max, 4.0)) continue;
    const a = angle_min + i * angle_increment;
    const px = cx + Math.cos(a) * r * scale;
    const py = cy - Math.sin(a) * r * scale;    // y-flip for screen coords
    ctx.fillRect(px - 1, py - 1, 2, 2);
  }
}

// ── latency ping ─────────────────────────────────────────────────────────
function startLatencyPing() {
  setInterval(() => {
    if (!ros || !connected) return;
    const t0 = Date.now();
    const p = new ROSLIB.Service({ ros, name: '/rosout/get_loggers',
                                   serviceType: 'rcl_interfaces/srv/GetLoggerLevels' });
    p.callService(new ROSLIB.ServiceRequest({ names: [] }), () => {
      document.getElementById('s-ping').textContent = (Date.now() - t0) + ' ms';
    }, () => {});
  }, 3000);
}

// ── camera helpers ───────────────────────────────────────────────────────
function camErr() {
  document.getElementById('cam-img').style.display = 'none';
  document.getElementById('cam-err').style.display = 'flex';
  document.getElementById('cam-err').textContent = 'Camera stream unavailable';
}
function camOk() {
  document.getElementById('cam-img').style.display = 'block';
  document.getElementById('cam-err').style.display = 'none';
}

// ── init ─────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  const saved = localStorage.getItem('rover_ip') || window.location.hostname;
  document.getElementById('robot-ip').value = saved;
  // Auto-connect if we were served from the robot
  if (window.location.hostname && window.location.hostname !== 'localhost' &&
      window.location.hostname !== '127.0.0.1') {
    connect();
  }
});
</script>
</body>
</html>
